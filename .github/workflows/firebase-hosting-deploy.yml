# Publishes the portal (the public/ folder) to Firebase Hosting on every push to main.
# Needs a service account key stored as a repository secret: either
# FIREBASE_SERVICE_ACCOUNT_MILANDHOO_SCOUT (created by `firebase init hosting:github`)
# or FIREBASE_SERVICE_ACCOUNT (added by hand).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILANDHOO_SCOUT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: milandhoo-scout
