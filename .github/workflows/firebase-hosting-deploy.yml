# Publishes the portal (the public/ folder) to Firebase Hosting on every push to main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud
# service account with the "Firebase Hosting Admin" and "API Keys Viewer" roles.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: milandhoo-scout
