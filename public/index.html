  setRead(S.notifications[0], true); audit(`Broadcast announcement “${d.title.trim()}” to ${d.to==='all'?'everyone':d.to==='leaders'?'leaders':pName(d.to)}`); closeModal(); refresh(); toast('Announcement sent'); };
/* ================= Cloud mode: Firebase Auth + Firestore =================
   Active only when firebase-config.js defines window.TRAILMARK_FIREBASE.
   Data layout (Firestore):
     portal/access      { members: { "email": "admin|leader|assistant|scout" } }  ← role source of truth
     portal/<key>       { json, by, ts }   one doc per data area (scouts, registers, …)
     portal/private     contacts + medical notes, readable by leaders only
     images/<id>        { data }           uploaded photos, logo and avatars          */
const CLOUD_KEYS = ['meta','settings','users','patrols','scouts','badges','syllabus','registers','sessions','events','albums','photos','notifications','audit','readBy','reminded'];
const CLOUD_DEF = { users:[], patrols:[], scouts:[], badges:[], syllabus:[], registers:[], sessions:[], events:[], albums:[], photos:[], notifications:[], audit:[], readBy:{}, reminded:{} };
const FB_VER = '10.12.2';
let LOGIN_ERR = '';
function takeLoginErr(){ const e = LOGIN_ERR; LOGIN_ERR = ''; return e; }
const Cloud = {
  on: (() => { try { const c = window.TRAILMARK_FIREBASE; return !!(c && c.apiKey && c.projectId && !/PASTE|YOUR/i.test(c.apiKey + c.projectId)); } catch(e){ return false; } })(),
  auth:null, db:null, role:null, members:{}, sent:{}, priv:{}, unsubs:[], timer:null, loading:new Set(), renderT:null,
  keys(){ return this.role==='scout' ? CLOUD_KEYS : [...CLOUD_KEYS, 'private']; },

  async start(){
    this.splash('Loading TrailMark…');
    try { const b = await Store.get('kv','brand'); S = { settings: Object.assign({ groupName:'TrailMark Scout Troop', school:'', logo:null, year:academicYear().label, terms:[], sessionTypes:[], lowAttendance:75 }, b || {}) }; } catch(e){}
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      await loadScript(base + 'firebase-app-compat.js');
      await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
    } catch(e){ this.splash('TrailMark could not reach Firebase. Check your internet connection and reload the page.'); return; }
    firebase.initializeApp(window.TRAILMARK_FIREBASE);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    try { await this.db.enablePersistence({ synchronizeTabs:true }); } catch(e){}
    this.install();
    this.auth.onAuthStateChanged(u => { if(u) this.enter(u); else { this.stop(); ME = null; renderApp(); } });
  },
  splash(msg){ $('#app').innerHTML = `<div style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center"><div class="stack" style="align-items:center">${emblemSVG(64)}<p class="muted">${esc(msg)}</p></div></div>`; },
  authMsg(e){ const c = e && e.code || ''; return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'That email and password do not match an account. Check both, or reset your password.' : /too-many/.test(c) ? 'Too many attempts. Wait a few minutes, or reset your password.' : /network/.test(c) ? 'No connection to the server. Check your internet and try again.' : /invalid-email/.test(c) ? 'Enter a valid email address.' : (e && e.message) || 'Sign-in failed.'; },

  /* ---- after Firebase sign-in ---- */
  async enter(u){
    this.splash('Opening your portal…');
    const email = u.email.toLowerCase(); let acc;
    try { acc = await this.db.doc('portal/access').get(); }
    catch(e){ LOGIN_ERR = 'Your account could not open the portal. Check that the Firestore security rules from the setup guide are published.'; await this.auth.signOut(); return; }
    if(!acc.exists) return this.setupView(u);
    this.members = acc.data().members || {}; const role = this.members[email];
    if(!role){ LOGIN_ERR = `${esc(u.email)} is not on the portal yet. Ask your Group Scout Leader to add you in Leaders → Add user.`; await this.auth.signOut(); return; }
    this.role = role;
    const keys = this.keys(); const st = { resets:{} };
    const snaps = await Promise.all(keys.map(k => this.db.doc('portal/' + k).get().catch(() => null)));
    snaps.forEach((s, i) => { if(s && s.exists){ const j = s.data().json; this.sent[keys[i]] = j; st[keys[i]] = JSON.parse(j); } });
    S = this.assemble(st);
    ME = this.findMe();
    if(!ME){ ME = { id:uid('u'), name:u.displayName || u.email.split('@')[0], email:u.email, role, phone:'', photo:null, title:ROLES[role], qualifications:[], activity:[] }; S.users.push(ME); }
    ME.role = role;
    Store.set('kv', 'brand', { groupName:S.settings.groupName, school:S.settings.school, year:S.settings.year });
    this.subscribe();
    if(role!=='scout'){ genReminders(); audit('Signed in'); }
    save(); R.route = isScout() ? 'me' : 'dashboard'; renderApp();
  },
  findMe(){ const e = (this.auth.currentUser?.email || '').toLowerCase(); return S.users.find(x => (x.email||'').toLowerCase()===e); },
  assemble(st){
    const out = { resets:{} };
    CLOUD_KEYS.forEach(k => { if(k==='meta') return; out[k] = st[k] !== undefined ? st[k] : JSON.parse(JSON.stringify(CLOUD_DEF[k] ?? {})); });
    out.v = st.meta?.v || 3; out.seededAt = st.meta?.seededAt || Date.now();
    out.settings = Object.assign({ groupName:'TrailMark Scout Troop', school:'', logo:null, year:academicYear().label, terms:[], sessionTypes:['Regular meeting'], lowAttendance:75 }, out.settings || {});
    this.priv = st.private || {}; this.mergePriv(out.scouts); return out;
  },
  mergePriv(scouts){ scouts.forEach(s => { const p = this.priv[s.id]; s.guardian = p?.guardian || s.guardian || {}; s.emergency = p?.emergency || s.emergency || {}; s.medical = p?.medical ?? s.medical ?? ''; }); },
  ser(k){
    if(k==='meta') return JSON.stringify({ v:S.v, seededAt:S.seededAt });
    if(k==='users') return JSON.stringify(S.users.map(({ pw, ...u }) => u));
    if(k==='scouts') return JSON.stringify(S.scouts.map(({ guardian, emergency, medical, ...s }) => s));
    if(k==='private') return JSON.stringify(Object.fromEntries(S.scouts.map(s => [s.id, { guardian:s.guardian||{}, emergency:s.emergency||{}, medical:s.medical||'' }])));
    if(k==='notifications' && S.notifications.length > 300) S.notifications.length = 300;
    return JSON.stringify(S[k] ?? CLOUD_DEF[k] ?? null);
  },

  /* ---- saving ---- */
  schedule(){ clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 400); },
  flush(){
    clearTimeout(this.timer); if(!ME || !this.db || this.role==='scout') return;
    this.keys().forEach(k => { const j = this.ser(k); if(j === this.sent[k]) return;
      if(j.length > 1000000){ toast(`The ${k} data is too large to save (1 MB limit per area). Delete old records or photos.`); return; }
      this.sent[k] = j;
      this.db.doc('portal/' + k).set({ json:j, by:ME.email, ts:Date.now() }).catch(e => { delete this.sent[k]; toast('Could not save changes: ' + (e.code==='permission-denied' ? 'your role cannot change this.' : e.message)); }); });
    if(this.role==='admin') this.syncAccess();
  },
  syncAccess(){
    const m = {}; S.users.filter(u => !u.disabled && !u.sample && u.email).forEach(u => m[u.email.trim().toLowerCase()] = u.role);
    m[this.auth.currentUser.email.toLowerCase()] = 'admin';
    if(JSON.stringify(Object.entries(m).sort()) === JSON.stringify(Object.entries(this.members).sort())) return;
    this.members = m; this.db.doc('portal/access').set({ members:m }).catch(e => toast('Could not update sign-in access: ' + e.message));
  },
  afterReplace(){ const me = this.findMe(); if(me) ME = me; else { ME.id = ME.id || uid('u'); S.users.push(ME); } ME.role = this.role; this.priv = {}; save(); },

  /* ---- live updates from other leaders ---- */
  subscribe(){
    this.stop();
    this.keys().forEach(k => this.unsubs.push(this.db.doc('portal/' + k).onSnapshot(s => { if(!s.exists || s.metadata.hasPendingWrites) return; this.applyRemote(k, s.data().json); }, () => {})));
    this.unsubs.push(this.db.doc('portal/access').onSnapshot(s => { if(!s.exists) return; this.members = s.data().members || {};
      const r = this.members[(this.auth.currentUser?.email||'').toLowerCase()];
      if(!r){ LOGIN_ERR = 'Your access to the portal was removed.'; this.auth.signOut(); return; }
      if(r !== this.role){ this.role = r; ME.role = r; this.subscribe(); renderApp(); } }, () => {}));
  },
  stop(){ this.unsubs.forEach(f => { try { f(); } catch(e){} }); this.unsubs = []; },
  applyRemote(k, j){
    if(j === this.sent[k]) return;
    if(this.ser(k) !== (this.sent[k] ?? this.ser(k))) return;   // local unsaved edit wins; it is about to be written
    this.sent[k] = j; const v = JSON.parse(j);
    if(k==='meta'){ S.v = v.v; S.seededAt = v.seededAt; return; }
    if(k==='private'){ this.priv = v; this.mergePriv(S.scouts); }
    else if(k==='scouts'){ S.scouts = v; this.mergePriv(S.scouts); }
    else S[k] = v;
    if(k==='users'){ const me = this.findMe(); if(me){ me.role = this.role; ME = me; } }
    this.rerender(k==='settings' || k==='users');
  },
  rerender(full){ clearTimeout(this.renderT); this.renderT = setTimeout(() => {
    const busy = modalStack.length || $('#lightbox') || (document.activeElement && document.activeElement.closest && document.activeElement.closest('input,textarea,select'));
    if(busy) return this.rerender(full);
    if(!ME) return; if(full) renderApp(); else { renderMain(); } }, 350); },

  /* ---- images ---- */
  want(id){ if(this.loading.has(id) || !this.db || !ME) return; this.loading.add(id);
    this.db.doc('images/' + id).get().then(s => { if(s.exists){ IMG[id] = s.data().data; Store.set('img', id, IMG[id]); this.rerender(id===S.settings.logo || id===ME?.photo); if(LB) drawLB(); } }).catch(() => {}); },
  upImg(id, data){ if(!this.db) return; if(data.length > 1000000){ toast('That image is too large to store. Use a smaller photo.'); return; } this.db.doc('images/' + id).set({ data, by:ME?.email || '', ts:Date.now() }).catch(e => toast('Photo upload failed: ' + e.message)); },
  delImg(id){ if(this.db) this.db.doc('images/' + id).delete().catch(() => {}); },
  async fetchAllImgs(){ try { const q = await this.db.collection('images').get(); q.forEach(d => { IMG[d.id] = d.data().data; Store.set('img', d.id, IMG[d.id]); }); } catch(e){} },

  /* ---- first sign-in: create the portal ---- */
  setupView(u){
    $('#app').innerHTML = `<div style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px"><form class="card" data-f="cloudSetup" style="width:100%;max-width:520px" novalidate>
      <div class="row nw" style="gap:12px;margin-bottom:14px">${emblemSVG(48)}<div><div class="eyebrow">First-time setup</div><h1 style="font-size:1.4rem">Set up TrailMark</h1></div></div>
      <p class="muted" style="margin-bottom:16px">You are signed in as <b>${esc(u.email)}</b>. Nobody has set up this portal yet, so you will become its Group Scout Leader (admin).</p>
      <div class="stack">${field('Your name', inp('name', u.displayName || '', 'required'))}${field('Scout group name', inp('group', 'School Scout Troop', 'required'))}${field('School', inp('school', ''))}
      <div class="field"><label>Start with</label><label class="check"><input type="radio" name="mode" value="sample" checked> Sample troop: 20 example scouts, registers and photos, to explore first</label><label class="check"><input type="radio" name="mode" value="empty"> An empty portal: keep the badge catalogue, syllabus and session templates only</label></div>
      <div id="setup-err"></div><button class="btn primary lg">Create portal</button><button type="button" class="btn ghost" data-a="logout">Sign out</button></div></form></div>`;
  },
  async createPortal(d){
    const u = this.auth.currentUser; const email = u.email.toLowerCase();
    if(!String(d.name||'').trim()) return $('#setup-err').innerHTML = `<div class="alert">${ic('alert','sm')}<span>Enter your name.</span></div>`;
    this.splash('Creating your portal…');
    const st = await buildSeed(); const admin = st.users.find(x => x.role==='admin');
    Object.assign(admin, { email:u.email, name:d.name.trim() });
    st.settings.groupName = d.group || st.settings.groupName; st.settings.school = d.school || '';
    if(d.mode==='sample') st.users.forEach(x => { if(x !== admin) x.sample = true; });
    if(d.mode==='empty'){ st.users = [admin]; st.patrols = []; st.scouts = []; st.registers = []; st.sessions = st.sessions.filter(s => s.template); st.events = []; st.albums = []; st.photos = []; st.notifications = []; st.audit = []; }
    try { await this.db.doc('portal/access').set({ members:{ [email]:'admin' } }); }
    catch(e){ LOGIN_ERR = 'Setup was blocked by the database rules. Publish firestore.rules from the setup guide, then sign in again.'; await this.auth.signOut(); return; }
    this.members = { [email]:'admin' }; this.role = 'admin'; S = st; ME = admin; this.sent = {};
    this.flush(); setTimeout(() => this.enter(u), 900);
  },

  /* ---- swap local-only behaviours for Firebase ones ---- */
  install(){
    F.cloudSetup = d => this.createPortal(d);
    F.login = async d => { try { await this.auth.signInWithEmailAndPassword(String(d.email).trim(), d.password); } catch(e){ $('#login-card').innerHTML = loginForm(this.authMsg(e)); } };
    F.resetReq = async d => { const em = String(d.email||'').trim();
      try { await this.auth.sendPasswordResetEmail(em); } catch(e){ if(/invalid-email/.test(e.code)) return $('#login-card').innerHTML = loginForm('Enter a valid email address.'); }
      $('#login-card').innerHTML = `<h2>Check your email</h2><p class="muted" style="margin:6px 0 20px">If an account exists for <b>${esc(em)}</b>, a password reset link is on its way. Check your spam folder if it does not arrive in a few minutes.</p><button class="btn primary lg" style="width:100%" data-a="backLogin">Back to sign in</button>`; };
    F.changePw = async d => { const err = m => $('#cpw-err').innerHTML = `<div class="alert">${ic('alert','sm')}<span>${m}</span></div>`;
      if(String(d.pw).length < 8) return err('Use at least 8 characters.');
      try { const u = this.auth.currentUser; await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, d.cur)); await u.updatePassword(d.pw); audit('Changed password'); save(); closeModal(); toast('Password updated'); }
      catch(e){ err(/wrong-password|invalid-credential/.test(e.code) ? 'Your current password is not right.' : e.message); } };
    A.logout = async () => { if(ME && this.role!=='scout'){ audit('Signed out'); this.flush(); } this.stop(); await this.auth.signOut(); };
    A.resetUserPw = async el => { const u = user(el.dataset.id); try { await this.auth.sendPasswordResetEmail(u.email); toast(`Password reset link emailed to ${u.email}`); audit(`Sent password reset email to ${u.name}`); save(); } catch(e){ toast('Could not send the reset email: ' + e.message); } };
    const origUser = F.user;
    F.user = async (d, f) => {
      if(!d.id){ if(String(d.pw||'').length < 8) return origUser(d, f);
        try { const sec = firebase.apps.find(a => a.name==='tm-secondary') || firebase.initializeApp(window.TRAILMARK_FIREBASE, 'tm-secondary');
          await sec.auth().createUserWithEmailAndPassword(String(d.email).trim(), d.pw); await sec.auth().signOut(); }
        catch(e){ if(e.code !== 'auth/email-already-in-use'){ $('#uf-err').innerHTML = `<div class="alert" style="margin-top:12px">${ic('alert','sm')}<span>Could not create the sign-in account: ${esc(this.authMsg(e))}</span></div>`; return; } } }
      await origUser(d, f); this.flush(); };
  },
};
/* ================= Settings, audit, guide ================= */

  return `${pageH('Administration', 'Settings')}
  <div class="grid g2">
  <form class="card" data-f="setGroup"><div class="card-h"><h2>Group & branding</h2></div><div class="stack">

    ${field('Group name', inp('groupName', st.groupName, 'required'))}${field('School', inp('school', st.school))}

    ${field('Academic year label', inp('year', st.year))}
    ${st.terms.map((t,i) => `<div class="row nw" style="gap:6px"><input class="inp" name="tname" value="${esc(t.name)}" style="width:110px;flex:none" aria-label="Term name"><input class="inp" type="date" name="tstart" value="${t.start}" aria-label="Start"><input class="inp" type="date" name="tend" value="${t.end}" aria-label="End"></div>`).join('')}
    ${field('Low-attendance alert below (%)', inp('low', st.lowAttendance, 'type="number" min="10" max="100"'))}
    <div class="row" style="justify-content:flex-end"><button class="btn primary">Save</button></div></div></form>
  <form class="card" data-f="setTypes"><div class="card-h"><h2>Session types</h2></div><div class="stack">${field('One per line (used when creating registers)', ta('types', st.sessionTypes.join('\n')))}<div class="row" style="justify-content:flex-end"><button class="btn primary">Save</button></div></div></form>
  <div class="card"><div class="card-h"><h2>Programme & people</h2></div><div class="list">
    ${[['medal','Badge catalogue', `${S.badges.length} badges`, 'badges'],['map','Syllabus structure', `${S.syllabus.length} items across ${STAGES.length} stages`, 'syllabus'],['users','User management', `${S.users.length} accounts`, 'leaders'],['flag','Patrols', `${S.patrols.length} patrols`, 'patrols'],['history','Audit log', `${S.audit.length} entries`, 'audit']].map(([i,t,s,r]) => `<button class="li" style="border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left;cursor:pointer" data-a="go" data-r="${r}"><span class="kpi"><span class="ic">${ic(i)}</span></span><span class="grow"><b>${t}</b><span class="small muted" style="display:block">${s}</span></span>${ic('right','sm')}</button>`).join('')}</div></div>
  <div class="card" style="grid-column:1/-1"><div class="card-h"><h2>Data</h2></div><p class="small muted" style="margin-bottom:12px">${Cloud.on ? 'Data is stored in your Firebase project and shared live with every leader. Download a backup now and then as an extra copy. A backup includes uploaded photos.' : 'This portal stores its data in this browser. Save a backup regularly and restore it on another device. A backup includes uploaded photos.'}</p>
    <div class="row"><button class="btn" data-a="backup">${ic('download','sm')} Download backup</button><label class="btn" for="restore-file" style="cursor:pointer">${ic('upload','sm')} Restore backup</label><input id="restore-file" type="file" accept=".json,.txt,application/json" class="sr" data-c="restore"><span class="spacer"></span><button class="btn danger" data-a="resetDemo">${ic('refresh','sm')} Reset to sample data</button></div></div>

C.logoFile = async el => { const f = el.files[0]; if(!f) return; try { const url = await readFile(f); const im = await loadImg(url); const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'); const k = Math.max(512/im.width, 512/im.height); x.fillStyle = '#fff'; x.fillRect(0,0,512,512); x.drawImage(im, (512-im.width*k)/2, (512-im.height*k)/2, im.width*k, im.height*k);
  dropImg(S.settings.logo); S.settings.logo = putImg(c.toDataURL('image/jpeg', .9)); audit('Uploaded a new group logo'); save(); renderApp(); toast('Logo updated'); } catch(e){ toast('That image could not be read'); } };
A.logoRemove = () => { dropImg(S.settings.logo); S.settings.logo = null; audit('Removed the group logo'); save(); renderApp(); };
F.setGroup = d => { S.settings.groupName = d.groupName || S.settings.groupName; S.settings.school = d.school; audit('Updated group details'); save(); renderApp(); toast('Saved'); };
F.setYear = d => { const n = [].concat(d.tname), a = [].concat(d.tstart), b = [].concat(d.tend); S.settings.terms = n.map((x,i) => ({ name:x, start:a[i], end:b[i] })); S.settings.year = d.year; S.settings.lowAttendance = Math.max(10, Math.min(100, +d.low || 75)); audit('Updated academic year and terms'); refresh(); toast('Saved'); };
F.setTypes = d => { const t = String(d.types).split('\n').map(x=>x.trim()).filter(Boolean); if(t.length) S.settings.sessionTypes = t; audit('Updated session types'); refresh(); toast('Saved'); };
A.backup = async () => { if(Cloud.on){ toast('Collecting photos…'); await Cloud.fetchAllImgs(); } const imgs = await Store.all('img'); saveFile(`trailmark-backup-${TODAY()}.json`, JSON.stringify({ app:'trailmark', state:S, images:imgs })); };
C.restore = async el => { const f = el.files[0]; if(!f) return; try { const j = JSON.parse(await f.text()); if(j.app!=='trailmark' || !j.state?.scouts) throw 0;
  confirmBox(`Replace all current data with the backup from <b>${esc(f.name)}</b>?`, async () => { await Store.clear('img'); for(const k in IMG) delete IMG[k]; for(const [k,v] of Object.entries(j.images||{})){ IMG[k] = v; await Store.set('img', k, v); if(Cloud.on) Cloud.upImg(k, v); } S = j.state; ME = S.users.find(u => u.id===ME.id) || S.users.find(u => u.role==='admin'); if(Cloud.on) Cloud.afterReplace(); else await Store.set('kv','state', S); renderApp(); toast('Backup restored'); }, 'Restore'); }
  catch(e){ toast('That file is not a TrailMark backup'); } };
A.resetDemo = () => confirmBox('Erase everything and reload the sample troop? Download a backup first if you want to keep your data.', async () => { await Store.clear('img'); for(const k in IMG) delete IMG[k]; S = await buildSeed(); ME = S.users.find(u => u.id===ME.id) || S.users[0]; if(Cloud.on) Cloud.afterReplace(); genReminders(); if(!Cloud.on) await Store.set('kv','state', S); R.route = 'dashboard'; renderApp(); toast('Sample data restored'); }, 'Reset');

VIEWS.audit = () => { if(ME.role!=='admin') return empty('lock','Only the Group Scout Leader can view the audit log'); const uf = R.q.u || ''; const q = (R.q.s||'').toLowerCase();
  const list = S.audit.filter(a => (!uf || a.user===uf) && (!q || a.action.toLowerCase().includes(q)));
  return `${pageH('Administration', 'Audit log', can('export')?`<button class="btn" data-a="auditExport">${ic('download','sm')} Export CSV</button>`:'')}
  <div class="row" style="margin-bottom:14px"><select class="inp" style="width:auto" data-c="auditU" aria-label="Filter by person">${opts([['','Everyone'], ...S.users.map(u=>[u.id,u.name])], uf)}</select><input class="inp" type="search" style="flex:1;min-width:180px" placeholder="Search actions" value="${esc(R.q.s||'')}" data-c="auditS" aria-label="Search actions"></div>
  <div class="card" style="padding:6px 14px"><div class="list">${list.slice(0,300).map(a => `<div class="li">${av(user(a.user)||{name:'System'},32)}<div class="grow"><span>${esc(a.action)}</span><div class="small muted">${esc(user(a.user)?.name||'System')} · ${new Date(a.ts).toLocaleString()}</div></div></div>`).join('') || empty('history','No matching entries')}</div></div>`; };
C.auditU = el => { R.q.u = el.value; renderMain(); };
C.auditS = el => { R.q.s = el.value; renderMain(); };
A.auditExport = () => saveFile(`trailmark-audit-${TODAY()}.csv`, csvOf([['time','user','action'], ...S.audit.map(a => [new Date(a.ts).toISOString(), user(a.user)?.name||'', a.action])]));

VIEWS.guide = () => { const sec = (icon, t, items) => `<div class="card"><div class="card-h"><span class="kpi"><span class="ic">${ic(icon)}</span></span><h2>${t}</h2></div><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${items.map(i => `<li>${i}</li>`).join('')}</ol></div>`;
  return `${pageH('Help', 'Leader guide')}
  <div class="alert info" style="margin-bottom:16px">${ic('compass','sm')}<span>A ten-minute tour of the portal. Each section matches an item in the menu. On a phone, use the bar at the bottom of the screen and tap <b>More</b> for everything else.</span></div>
  <div class="grid g2">
  ${sec('clipboard','Taking attendance', ['Tap <b>Attendance</b>, then <b>New register</b>. Pick the date, session type and the patrol or whole troop.','Tap <b>Mark all present</b>, then change the exceptions: Late (gold), Absent (red) or Excused (blue-grey).','For Late, Absent and Excused, add a reason. Late arrivals record the time automatically; adjust it if needed.','The counter at the top updates as you go. <b>Save draft</b> keeps working; <b>Finalize</b> locks the register.','Only the Group Scout Leader can edit a finalized register, and every change is recorded in the audit log.','Use <b>Export</b> for a PDF, Excel file or a printable sign-in sheet. The <b>Reports</b> tab shows patrol and individual rates.'])}
  ${sec('users','Scout profiles', ['Open <b>Scouts</b> and filter by patrol, status or rank. Tap a scout to see the profile.','Tap the camera on the photo to upload and crop a picture.','Tabs hold badges, attendance history, syllabus sign-offs and activities.','Contacts and medical notes are restricted: leaders see contacts, assistants see medical notes only, scouts see neither.','<b>Profile PDF</b> saves a one-page record for parents or the district office.'])}
  ${sec('medal','Badges and syllabus', ['In <b>Badges → Track progress</b>, tick each requirement as a scout completes it. Your name and the date are saved with the tick.','When the last requirement is ticked, you get a notification that the badge is ready to award.','<b>Award badges</b> handles one scout or a whole patrol at once. Each award adds 5 patrol points.','<b>Syllabus</b> shows each patrol\'s progress through its stage. A red “behind schedule” chip appears when an item passes its target date.','Tap a syllabus item to sign off several scouts at once.'])}
  ${sec('fire','Planning sessions', ['<b>Plan session</b> starts blank or from a template such as “Standard weekly meeting”.','Link syllabus items and badges, build the timeline (opening, game, skills, closing) and list the materials.','On the day, tick materials off as you pack. Afterwards, write a reflection, create the linked register and attach photos.','<b>Duplicate</b> copies a good session to a new date.'])}
  ${sec('calendar','Calendar', ['Switch between month, week, day and agenda. Phones open in agenda view.','Tap a type chip to hide or show that kind of event.','Weekly meetings repeat automatically and skip holidays. Delete one date of a repeating event without losing the rest.','Leaders get a reminder notification two days before each event with reminders turned on.','<b>iCal</b> exports everything for Google Calendar, Outlook or Apple Calendar.'])}
  ${sec('image','Photos', ['<b>Upload photos</b> accepts several at once. On a phone you can take them with the camera.','Photos are compressed automatically and grouped into albums by academic year.','Tag scouts in each photo. If a tagged scout has no photo consent, the photo is marked private automatically.','Private photos are visible to leaders only. <b>Year in highlights</b> plays the year as a slideshow.'])}
  ${sec('bell','Notifications', ['The bell shows unread alerts: upcoming events, badge completions, low attendance, renewals, birthdays, new photos, tasks and announcements.','Open a notification to jump to the related scout, register or album.','The Group Scout Leader can send announcements to everyone, leaders only, or a single patrol.'])}
  ${sec('shield','Roles at a glance', ['<b>Group Scout Leader</b>: everything, including settings, users, the audit log and editing finalized registers.','<b>Scout Leader</b>: scouts, attendance, patrols, badges, sessions, calendar and photos.','<b>Assistant Leader</b>: attendance, badge and syllabus sign-offs. No deletions or settings.','<b>Scout</b>: their own profile, badges, attendance, upcoming events and public photos.'])}
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h2>About this version</h2></div>${Cloud.on ? `<p class="small muted">This is the online edition of TrailMark. Data lives in your group's Firebase project and updates live for every signed-in leader. Accounts, roles and password-reset emails are handled by Firebase Authentication. Contacts and medical notes are stored separately and only leader accounts can read them.</p>` : `<p class="small muted">This is the browser edition of TrailMark: it runs entirely on this device and keeps data in this browser's storage, so use <b>Settings → Download backup</b> to move data or keep a copy. Sign-in, roles and password resets work inside the portal, but reset codes appear on screen instead of being emailed, and there is no shared server, so each device has its own copy of the data.</p>`}</div>`; };

/* ================= Boot ================= */
(async function boot(){
  applyTheme();
  if(Cloud.on){ await Store.open(); Object.assign(IMG, await Store.all('img')); return Cloud.start(); }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { const b = $('#theme-btn'); if(b) b.innerHTML = ic(isDark()?'sun':'moon'); }); } catch(e){}
  await Store.open();
  let st = await Store.get('kv','state');
  if(!st || st.v!==3 || !st.scouts){ st = await buildSeed(); await Store.set('kv','state', st); }
  S = st; Object.assign(IMG, await Store.all('img'));
  const sess = await Store.get('kv','session'); if(sess) ME = S.users.find(u => u.id===sess.uid && !u.disabled) || null;
  genReminders(); save();
  if(ME && isScout()) R.route = 'me';
  renderApp();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
