<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Milandhoo Scout Portal: the scout leader portal for attendance, patrols, badges, syllabus, sessions, calendar and photo highlights.">
<meta name="theme-color" content="#0A5C8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milandhoo Scouts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}/* leader hierarchy: tree */
.org{container-type:inline-size;margin-top:6px}
.org-lead{display:flex;flex-direction:column;align-items:center}
.org-node{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px 10px 10px;width:min(320px,100%);box-shadow:0 10px 22px -18px rgba(0,0,0,.45)}
.org-node>div{min-width:0}.org-node b{display:block;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.org-r{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.org-node.gl{background:linear-gradient(135deg,var(--primary),#0A5E8F);color:#fff;border:0;box-shadow:0 12px 26px -12px var(--primary)}.org-node.gl .org-r{color:#BFE3F7}.org-node.gl .org-link{color:#fff}
.org-node.lt{border-top:4px solid var(--ok)}.org-node.lt .org-r{color:var(--ok)}
.org-node.li{border-top:4px solid #E0A030}.org-node.li .org-r{color:#B7791F}
.org-avs{display:flex;flex:none}.org-avs .av+.av{margin-left:-12px}.org-avs .av{border:2px solid var(--surface)}
.org-vl{width:2px;height:22px;background:var(--line);flex:none}
.org-link{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}.org-link:hover{text-decoration:underline}
.org-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;position:relative}
.org-team{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:12px 14px 6px;box-shadow:0 12px 26px -20px rgba(0,0,0,.45);position:relative}
.org-team h4{margin:0 0 2px;font-family:"Roboto Slab",serif;font-size:1rem;color:var(--c);display:flex;gap:8px;align-items:flex-start}
.org-ti{flex:none;font-family:initial}
.org-du{color:var(--ink-2);font-size:.8rem;margin-bottom:6px}
.org-m{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.92rem;font-weight:600;border-top:1px solid var(--line-2)}
.org-ei{width:34px;height:34px;border-radius:10px;background:var(--wash);display:grid;place-items:center;font-size:1.1rem;flex:none}
@container (min-width:900px){
  .org-teams{grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:22px}
  .org-teams:before{content:"";position:absolute;top:-22px;height:2px;left:calc((100% - (var(--n) - 1)*14px)/var(--n)/2 - 1px);right:calc((100% - (var(--n) - 1)*14px)/var(--n)/2 - 1px);background:var(--line)}
  .org-team:before{content:"";position:absolute;left:calc(50% - 1px);top:-26px;width:2px;height:22px;background:var(--line)}
}
@container (max-width:899px){ .org-lead{margin-bottom:16px} .org-lead .org-vl:last-child{display:none} }
/* badges: KPIs, gallery and sash report */
.bkpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.bkpi .k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.bkpi .k>div{min-width:0}.bkpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none}
.bkpi .ic .badge-ic{width:34px;height:34px}
.bkpi b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bkpi span{font-size:.78rem;color:var(--ink-2)}
.bgal{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.bgc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.bgc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.bgc:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(0,0,0,.35)}
.bgc:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--cc)}
.bgc-h{display:flex;gap:12px;align-items:center}.bgc-h .badge-ic{width:58px;height:58px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.bgc-h b{display:block;font-size:.95rem;line-height:1.25}.bgc-h small{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.bgc-bar{height:6px;border-radius:9px;background:var(--line-2);margin:12px 0 6px;overflow:hidden}.bgc-bar i{display:block;height:100%;background:var(--cc);border-radius:9px}
.bgc-ct{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-2);font-weight:600}
.bgc-avs{display:flex;margin-top:10px;align-items:center;min-height:30px}.bgc-avs .av{border:2px solid var(--surface);margin-left:-8px}.bgc-avs .av:first-child{margin-left:0}
.bgc-avs em{font-style:normal;font-size:.76rem;color:var(--ink-2);margin-left:8px;font-weight:600}
.bgc.zero{opacity:.62}.bgc.zero .badge-ic img{filter:grayscale(1)}
.bgal-side{display:grid;gap:12px;position:sticky;top:80px}.bgal-side .card{padding:16px}.bgal-side h3{margin:0 0 8px;font-size:1rem;display:flex;gap:6px;align-items:center}
.bgl{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;border-top:1px solid var(--line-2);font:inherit;font-size:.88rem;font-weight:600;background:none;color:inherit;width:100%;text-align:left}
button.bgl{cursor:pointer}button.bgl:hover .n{text-decoration:underline}
.bgl .r{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.72rem;color:var(--ink-2);flex:none}
.bgl .r.m1{background:#F6E3A8;color:#8A6510}.bgl .r.m2{background:#E1E7EC;color:#56656F}.bgl .r.m3{background:#F1D3BC;color:#8A4E22}
.bgl .n{flex:1;min-width:0}.bgl .t{font-weight:800;color:var(--primary)}.bgl .dot{width:10px;height:10px;border-radius:50%;flex:none}
.ssh-strip{display:flex;gap:4px;overflow-x:auto;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
.ssh-strip button{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;flex:none;padding:6px 2px;border-radius:12px;font:inherit;font-size:.66rem;font-weight:600;text-align:center;color:var(--ink-2);line-height:1.15;background:none;border:0;cursor:pointer}
.ssh-strip button:hover{background:var(--surface-2)}
.ssh-strip .badge-ic{width:40px;height:40px}.ssh-strip button.on{background:var(--wash);color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.ssh-strip u{text-decoration:none;font-weight:800;color:var(--ink)}
.ssh-gh{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 8px}.ssh-gh.girl{color:var(--girl)}.ssh-gh.boy{color:var(--boy)}
.ssh-list{display:grid;gap:10px}
.ssh{display:grid;grid-template-columns:240px minmax(0,1fr) 120px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;border-left:5px solid var(--line)}
.ssh.girl{border-left-color:var(--girl)}.ssh.boy{border-left-color:var(--boy)}
.ssh-who{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.ssh-who b{display:block;font-size:.92rem}.ssh-who small{color:var(--ink-2);font-size:.74rem}.ssh-who:hover b{text-decoration:underline}
.ssh-sash{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:12px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ok) 12%,var(--surface)) 0 12px,color-mix(in srgb,var(--ok) 17%,var(--surface)) 12px 24px);min-height:52px;flex-wrap:wrap}
.ssh-b{display:inline-grid;border-radius:50%}.ssh-b .badge-ic{width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.ssh-b.hl{outline:3px solid var(--primary);outline-offset:1px}
.ssh-sash em{font-style:normal;color:var(--ok);opacity:.75;font-size:.8rem;font-weight:600}
.ssh-cnt{text-align:right}.ssh-cnt b{font-size:1.3rem;font-family:"Roboto Slab",serif}.ssh-cnt small{display:block;color:var(--ink-2);font-size:.72rem}
.ssh-bar{height:6px;border-radius:9px;background:var(--line-2);margin-top:6px;overflow:hidden}.ssh-bar i{display:block;height:100%;background:var(--ok)}
@media (max-width:1100px){ .bgal{grid-template-columns:minmax(0,1fr)} .bgal-side{position:static;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))} }
@media (max-width:900px){ .bkpi{grid-template-columns:repeat(2,minmax(0,1fr))} .ssh{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px} .ssh-sash{grid-column:1/-1;grid-row:2} }
@media (max-width:560px){ .bkpi .k{padding:10px} .bkpi .ic{width:36px;height:36px;font-size:.85rem} .bkpi b{font-size:.85rem} .bgc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px} .bgc{padding:10px} .bgc-h{flex-direction:column;align-items:flex-start;gap:6px} .bgc-h .badge-ic{width:46px;height:46px} .ssh-b .badge-ic{width:32px;height:32px} }
/* attendance register: formal list (design B) */
:root{--fm-P:#2F6F4F;--fm-L:#9A6A10;--fm-A:#9B2C2C;--fm-E:#55606B}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--fm-P:#3F9268;--fm-L:#B88227;--fm-A:#C0504A;--fm-E:#6F7D8A} }
:root[data-theme="dark"]{--fm-P:#3F9268;--fm-L:#B88227;--fm-A:#C0504A;--fm-E:#6F7D8A}
.rmeta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.rmeta>div{padding:10px 14px;border-left:1px solid var(--line-2);min-width:0}.rmeta>div:first-child{border-left:0}
.rmeta small{display:block;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.rmeta b{font-size:.9rem;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rmeta a{color:var(--primary);text-decoration:none}
.rst{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;border:1px solid #D08A12;color:#9A6A10;background:#FFF8EA;border-radius:6px;padding:2px 8px}
.rst.fin{border-color:var(--fm-P);color:#fff;background:var(--fm-P)}
.rstat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5}
.rstat>*{padding:11px 14px;border:0;border-left:1px solid var(--line-2);position:relative;background:none;font:inherit;color:inherit;text-align:left}.rstat>:first-child{border-left:0}
.rstat>button{cursor:pointer;transition:background .12s,opacity .12s}.rstat>button:hover{background:var(--surface-2)}
.rstat>button.on{background:color-mix(in srgb,var(--c) 12%,var(--surface))}.rstat>button.on:before{height:5px}.rstat>button.on span{color:var(--ink)}
.rstat>button.dim{opacity:.55}
.rsf-note{display:flex;align-items:center;gap:10px;margin:-4px 0 10px;font-size:.85rem;color:var(--ink-2)}
.rstat>*:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.rs-P{--c:var(--fm-P)}.rs-L{--c:var(--fm-L)}.rs-A{--c:var(--fm-A)}.rs-E{--c:var(--fm-E)}.rs-U{--c:var(--line)}.rs-T{--c:var(--primary)}
.rstat b{display:block;font-size:1.4rem;font-weight:700;font-family:var(--f-head);line-height:1.2}
.rstat span{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.rlist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rl-h,.rl-r{display:grid;grid-template-columns:36px minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) 330px;gap:14px;align-items:center;padding:10px 16px}
.rl-h{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-top:9px;padding-bottom:9px}
.rl-h span:last-child{text-align:center}
.rl-sh{padding:7px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}.rl-sh span{font-weight:600}
.rl-r{border-bottom:1px solid var(--line-2)}.rl-r:last-child{border-bottom:0}
.rl-ini{width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:.72rem;overflow:hidden}
.rl-ini img{width:100%;height:100%;object-fit:cover}
.rl-ini.girl{border:2.5px solid var(--girl)}.rl-ini.boy{border:2.5px solid var(--boy)}
.rl-nm{min-width:0}.rl-nm b{display:block;font-weight:600;font-size:.92rem}.rl-nm small{display:flex;gap:4px;align-items:center;color:var(--ink-2);font-size:.75rem}
.rl-pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rl-opt{display:grid;grid-template-columns:repeat(4,82px);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rl-opt button{height:36px;border:0;border-left:1px solid var(--line);background:var(--surface);font:inherit;font-size:.78rem;font-weight:600;color:var(--ink-2);cursor:pointer;padding:0 6px}
.rl-opt button:first-child{border-left:0}.rl-opt button:hover:not(:disabled):not(.on){background:var(--surface-2);color:var(--ink)}
.rl-opt button.on{color:#fff}.rl-opt button[data-s=P].on{background:var(--fm-P)}.rl-opt button[data-s=L].on{background:var(--fm-L)}.rl-opt button[data-s=A].on{background:var(--fm-A)}.rl-opt button[data-s=E].on{background:var(--fm-E)}
.rl-opt button:disabled{cursor:default}
.rl-rk{font-size:.86rem}
.rl-x{grid-column:2/-1;display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--ink-2)}.rl-x label{flex:none}.rl-x .inp{height:34px;font-size:.84rem;flex:1}.rl-x .inp[type=time]{flex:0 0 140px;width:140px}
.reg-actions.rfoot{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
.reg-actions.rfoot #reg-left{color:var(--ink-2)}
@media (max-width:900px){ .rmeta{grid-template-columns:repeat(2,minmax(0,1fr))} .rmeta>div{border-left:0;border-top:1px solid var(--line-2)} .rmeta>div:nth-child(-n+2){border-top:0} .rmeta>div:nth-child(even){border-left:1px solid var(--line-2)} .rmeta>div:last-child{grid-column:1/-1;border-left:0}
  .rstat{grid-template-columns:repeat(3,minmax(0,1fr));top:calc(58px + env(safe-area-inset-top,0px))} .rstat>*:nth-child(4){border-left:0} .rstat>*:nth-child(n+4){border-top:1px solid var(--line-2)} .rstat>*{padding:8px 10px} .rstat b{font-size:1.1rem} .rstat span{font-size:.6rem}
  .rl-h{display:none} .rl-rk{display:none} .rl-r{grid-template-columns:34px minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px} .rl-opt{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))} .rl-opt button{height:40px} .rl-x{grid-column:1/-1;flex-wrap:wrap} .rl-pt{text-align:right}
  .rfoot #reg-left{display:none} }

/* scouts list: same formal template as the register */
.sstat{position:static;margin-bottom:14px}
.ss-T{--c:var(--primary)}.ss-G{--c:var(--girl)}.ss-B{--c:var(--boy)}
.sl-r{display:grid;grid-template-columns:36px minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr) 130px;gap:14px;align-items:center;padding:10px 16px;border:0;border-bottom:1px solid var(--line-2);background:var(--surface);width:100%;font:inherit;color:inherit;text-align:left}
button.sl-r{cursor:pointer}button.sl-r:hover{background:var(--surface-2)}button.sl-r:hover .sl-nm b{text-decoration:underline}
.slist2 .sl-r:last-child{border-bottom:0}
.sl-h{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-top:9px;padding-bottom:9px}
.sl-nm{min-width:0}.sl-nm b{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl-nm small{display:block;color:var(--ink-2);font-size:.75rem}
.sl-rk{font-size:.86rem}
.sl-st{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid currentColor;line-height:1.2}
.sl-st.P{color:var(--fm-P)}.sl-st.L{color:var(--fm-L)}.sl-st.A{color:var(--fm-A)}.sl-st.E{color:var(--fm-E)}
.sl-att{display:flex;align-items:center;gap:8px;justify-content:flex-end}.sl-att b{font-size:.84rem;font-weight:700;min-width:38px;text-align:right}
.sl-att i{display:block;width:64px;height:6px;border-radius:9px;background:var(--line-2);overflow:hidden}.sl-att u{display:block;height:100%;border-radius:9px}
.sl-r .c-show{display:none}.sl-r .gset{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:900px){ .sstat{grid-template-columns:repeat(3,minmax(0,1fr))} .sl-r{grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:10px 12px} .sl-r .c-hide{display:none} .sl-r .c-show{display:inline} .sl-att i{width:44px} }
/* Scout Notes hub: banner + picture shelves */
.nhero{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;color:#fff;background:linear-gradient(120deg,#0A5C8F,#0D78B6 55%,#128944);margin-bottom:22px}
.nhero .eyebrow{color:#BFE3F7}.nhero h1{color:#fff;font-size:clamp(1.5rem,3vw,2.1rem);margin:4px 0 6px}.nhero p{margin:0 0 16px;color:#DCEEF8;max-width:60ch}
.nhero-art{position:absolute;right:-30px;top:-30px;opacity:.12}.nhero-art svg{width:240px;height:240px}
.nhero-s{display:flex;align-items:center;gap:10px;max-width:560px;background:#fff;color:var(--ink-2);border-radius:14px;padding:0 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.nhero-s input{flex:1;border:0;outline:0;font:inherit;font-size:1rem;padding:13px 0;background:none;color:#13283A;min-width:0}
.nhero-q{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.nhero-q button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:6px 13px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.nhero-q button:hover{background:rgba(255,255,255,.26)}.nhero-q button.on{background:#fff;color:#0A5C8F}
.nshelf{margin-bottom:24px}.nshelf-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.nshelf-h h2{margin:0;font-size:1.25rem}
.nshelf-h .dot{width:12px;height:12px;border-radius:4px;flex:none}.nshelf-all{margin-left:auto;border:0;background:none;color:var(--primary);font:inherit;font-weight:700;font-size:.88rem;cursor:pointer}
.nrail{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.nrail>*{scroll-snap-align:start}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

.side-brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;min-height:72px}
.side-brand .logo{width:40px;height:40px;flex:none}
.side-brand .name{font-family:var(--f-head);font-weight:600;font-size:1.05rem;line-height:1.15}
.side-brand .sub{font-size:.72rem;color:var(--side-ink-2);letter-spacing:.04em}
.shell.collapsed .side-brand .txt,.shell.collapsed .nav-label,.shell.collapsed .nav-sec{display:none}
.side nav{flex:1;overflow-y:auto;padding:6px 10px 12px}
.nav-sec{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink-2);padding:14px 12px 6px}
.nav-item{text-decoration:none;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;color:var(--side-ink);border-radius:10px;cursor:pointer;text-align:left;position:relative;font-weight:500;min-height:42px}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-hover);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item.active svg{color:var(--gold)}
.nav-item .cnt{margin-left:auto;background:var(--gold);color:var(--on-gold);border-radius:99px;font-size:.7rem;padding:1px 7px;font-weight:700}
.shell.collapsed .nav-item{justify-content:center}
.shell.collapsed .nav-item .cnt{position:absolute;top:4px;right:6px;margin:0}
.side-foot{padding:12px 10px 16px;border-top:1px solid rgba(255,255,255,.08)}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:64px}
.top .logo-m{display:none;width:34px;height:34px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;flex:none}
.icon-btn:hover{background:var(--wash)}
.bell-dot{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-size:.68rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0 14px 0 40px}
.search>svg{position:absolute;left:12px;top:11px;color:var(--ink-2)}
.search-res{position:absolute;top:48px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:420px;overflow:auto;padding:6px;z-index:50}
.sr-group{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px 4px}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.sr-item:hover,.sr-item.on{background:var(--wash)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.prof-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 4px;border-radius:12px;cursor:pointer}
.prof-btn:hover{background:var(--wash)}
.prof-btn .who{text-align:left;line-height:1.2}
.prof-btn .who b{display:block;font-size:.86rem}
.prof-btn .who span{font-size:.72rem;color:var(--ink-2)}
.pop{position:absolute;right:0;top:52px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);min-width:240px;padding:6px;z-index:60}
.pop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:0;background:none;width:100%;cursor:pointer;text-align:left}
.pop-item:hover{background:var(--wash)}
main{padding:24px;max-width:1360px;width:100%;margin:0 auto;flex:1}
.bnav{display:none}
.drawer-mask{display:none}

/* ===== Components ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1;min-width:0}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-h .t{flex:1;min-width:220px}
.page-h h1{margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:.8rem;border-radius:8px}
.btn.lg{height:48px;padding:0 20px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--wash);display:inline-grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface-2);width:100%;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:32px}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.seg{display:inline-flex;background:var(--wash);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--green-2);border-radius:99px}
.bar.gold>i{background:var(--gold)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty svg{width:40px;height:40px;color:var(--green-2);margin-bottom:8px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line-2);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-head);font-size:1.9rem;font-weight:600;line-height:1}
.kpi .k{font-size:.8rem;color:var(--ink-2);font-weight:500}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--wash);display:grid;place-items:center;color:var(--green)}
.kpi.gold .ic{background:var(--gold-soft);color:var(--gold-ink)}
.badge-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold-ink);border:2px solid var(--gold)}
.badge-ic.prog{background:var(--wash);color:var(--green);border-color:var(--line)}
.badge-ic.lg{width:64px;height:64px}
.badge-ic.img{background:none;border:0;border-radius:0}
.badge-ic.xl{width:84px;height:84px}
.bcard{text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center}
.bgroup{margin-bottom:22px}.bgroup h2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.syl{display:flex;flex-direction:column;gap:6px;line-height:1.55}.syl .h{font-family:var(--f-head);font-weight:600;font-size:1rem;margin-top:10px}.syl .alt{font-weight:700;color:var(--primary);margin-top:10px}
.syl .req{display:flex;gap:8px}.syl .req b{min-width:22px;color:var(--primary)}.syl .sub{padding-left:30px;color:var(--ink-2)}.syl .note{background:var(--wash);border-radius:10px;padding:10px 12px;font-size:.92rem}
.badge-ic.img img{width:100%;height:100%;object-fit:contain}
.badge-ic.img.prog img{filter:grayscale(1);opacity:.6}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-size:.88rem;align-items:flex-start}
.alert.info{background:var(--wash);color:var(--ink)}

/* Modal / toast */
#modal-root .mask{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:500;animation:up .2s;max-width:90vw}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Login ===== */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:linear-gradient(160deg,var(--side-2),var(--side) 70%);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{color:#fff;font-size:2.3rem;max-width:12ch}
.login-art p{color:var(--side-ink-2);max-width:42ch;margin-top:12px}
.login-art svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;opacity:.9}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login-card{width:100%;max-width:400px}
.demo-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-acc button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer}
.demo-acc button:hover{border-color:var(--gold)}
.demo-acc b{display:block;font-size:.82rem} .demo-acc span{font-size:.72rem;color:var(--ink-2)}

/* ===== Dashboard ===== */
.welcome{background:linear-gradient(120deg,var(--side) 0%,var(--side-2) 100%);color:var(--side-ink);border-radius:18px;padding:24px;display:flex;gap:20px;align-items:center;position:relative;overflow:hidden;flex-wrap:wrap}
.welcome h1{color:#fff;font-size:1.55rem}
.welcome .next{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;min-width:240px;position:relative;z-index:1}
.welcome .next .eyebrow{color:var(--gold-pale)}
.welcome .bgsvg{position:absolute;right:0;bottom:0;height:100%;opacity:.35;pointer-events:none}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.quick .btn{background:var(--surface)}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.lb-row:last-child{border:0}
.lb-rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--wash)}
.lb-rank.r1{background:var(--gold);color:var(--on-gold)}
.photo-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-strip img,.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;cursor:pointer;background:var(--wash)}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f-ui)}
svg.chart .grid{stroke:var(--line-2)}

/* ===== Profile ===== */
.prof-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof-photo{position:relative}
.prof-photo .av{width:104px;height:104px;font-size:2rem;border:3px solid var(--surface);box-shadow:var(--shadow)}
.prof-photo .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--on-gold);border:2px solid var(--surface);display:grid;place-items:center;cursor:pointer}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.facts dt{font-size:.74rem;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:2px 0 0;font-weight:500}
.att-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.att-sum div{border-radius:12px;padding:12px;text-align:center}
.att-sum b{display:block;font-family:var(--f-head);font-size:1.4rem}
.restricted{border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}

/* ===== Attendance ===== */
.reg-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.reg-row:last-child{border:0}
.reg-row .nm{flex:1;min-width:150px;display:flex;align-items:center;gap:10px}
.toggles{display:grid;grid-template-columns:repeat(4,96px);gap:6px;flex:none}
.tg{height:44px;min-width:64px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;white-space:nowrap;overflow:hidden}
.tg[data-s=P].on{background:var(--st-p);border-color:var(--st-p);color:var(--st-p-ink)}
.tg[data-s=L].on{background:var(--st-l);border-color:var(--st-l);color:var(--st-l-ink)}
.tg[data-s=A].on{background:var(--st-a);border-color:var(--st-a);color:var(--st-a-ink)}
.tg[data-s=E].on{background:var(--st-e);border-color:var(--st-e);color:var(--st-e-ink)}
.tg:disabled{cursor:default}
.reg-extra{flex-basis:100%;display:flex;gap:8px;padding-left:52px;flex-wrap:wrap}
.reg-extra .inp{height:36px;font-size:.84rem}
.counter{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0}
.counter div{border-radius:12px;padding:8px 10px;text-align:center;font-weight:600;font-size:.78rem}
.counter b{display:block;font-size:1.3rem;font-family:var(--f-head)}
.c-p{background:var(--st-p);color:var(--st-p-ink)} .c-l{background:var(--st-l);color:var(--st-l-ink)} .c-a{background:var(--st-a);color:var(--st-a-ink)} .c-e{background:var(--st-e);color:var(--st-e-ink)} .c-u{background:var(--wash);color:var(--ink)}
.st-pill{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:700;font-size:.74rem}
.st-P{background:var(--st-p);color:var(--st-p-ink)} .st-L{background:var(--st-l);color:var(--st-l-ink)} .st-A{background:var(--st-a);color:var(--st-a-ink)} .st-E{background:var(--st-e);color:var(--st-e-ink)}

/* ===== Patrols ===== */
.patrol-col{border-top:5px solid var(--pc);min-height:200px}
.dz{display:flex;flex-direction:column;gap:6px;min-height:80px;border-radius:10px;padding:4px;transition:background .15s}
.dz.over{background:var(--wash);outline:2px dashed var(--green-2)}
.drag{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:grab}
.drag.dragging{opacity:.4}
.emblem{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}

/* ===== Calendar ===== */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mcal{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mcal-h,.mcal-w{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr))}
.mcal-h{background:var(--surface-2);border-bottom:1px solid var(--line)}.mcal-h span{padding:9px 8px;font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--ink-2)}
.mcal-w{border-bottom:1px solid var(--line-2)}.mcal-w:last-child{border-bottom:0}
.mcal-wn{border-right:1px solid var(--line-2);font-size:.68rem;font-weight:700;color:var(--ink-2);text-align:center;padding:10px 2px;line-height:1.3;background:var(--surface-2)}
.mcal-wn em{display:block;font-style:normal;color:var(--primary);font-size:.62rem}
.mcal-d{min-height:108px;border-right:1px solid var(--line-2);padding:7px 6px 6px;position:relative;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mcal-d:last-child{border-right:0}.mcal-d:hover{background:var(--surface-2)}
.mcal-d.out{background:var(--surface-2)}.mcal-d.out .mcal-n{color:var(--ink-2);opacity:.55}
.mcal-n{font-size:.82rem;font-weight:700;display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:nowrap}.mcal-n .mcal-mark{flex:1 1 0;-webkit-line-clamp:3;overflow-wrap:break-word;hyphens:auto}.mcal-num{flex:none}

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY = () => iso(new Date());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtD(s, mode='med'){ if(!s) return '—'; const d = pd(s);
  if(mode==='short') return `${d.getDate()} ${MON[d.getMonth()]}`;
  if(mode==='long') return `${DOWL[d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]} ${d.getFullYear()}`;
  if(mode==='dow') return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
function fmtT(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${pad(m)} ${ap}`; }
function ago(ts){ const s = (Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' h ago'; const d=Math.floor(s/86400); return d===1?'yesterday':d+' days ago'; }
function age(dob){ const d=pd(dob), n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--; return a; }
const pct = (a, b) => b ? Math.round(a*100/b) : 0;
const by = k => (a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0);
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

/* ---- storage: IndexedDB with in-memory fallback ---- */
const Store = {
  db:null, mem:{},
  open(){ return new Promise(res => { try { const r = indexedDB.open('trailmark', 2);
      r.onupgradeneeded = () => { const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('img')) d.createObjectStore('img'); };
      r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); r.onblocked = () => res();
    } catch(e){ res(); } }); },
  get(st, k){ return new Promise(res => { if(!this.db) return res(this.mem[st+':'+k] ?? null);
    try { const q = this.db.transaction(st).objectStore(st).get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch(e){ res(null); } }); },
  set(st, k, v){ return new Promise(res => { if(!this.db){ this.mem[st+':'+k]=v; return res(); }
    try { const t = this.db.transaction(st,'readwrite'); t.objectStore(st).put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch(e){ this.mem[st+':'+k]=v; res(); } }); },
  del(st, k){ return new Promise(res => { if(!this.db){ delete this.mem[st+':'+k]; return res(); }
    try { const t = this.db.transaction(st,'readwrite'); t.objectStore(st).delete(k); t.oncomplete = () => res(); t.onerror = () => res(); } catch(e){ res(); } }); },
  all(st){ return new Promise(res => { if(!this.db){ const o={}; for(const k in this.mem) if(k.startsWith(st+':')) o[k.slice(st.length+1)]=this.mem[k]; return res(o); }
    try { const out = {}; const q = this.db.transaction(st).objectStore(st).openCursor();
      q.onsuccess = () => { const c = q.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); }; q.onerror = () => res({}); } catch(e){ res({}); } }); },
  clear(st){ return new Promise(res => { if(!this.db){ for(const k in this.mem) if(k.startsWith(st+':')) delete this.mem[k]; return res(); }
    try { const t = this.db.transaction(st,'readwrite'); t.objectStore(st).clear(); t.oncomplete = () => res(); t.onerror = () => res(); } catch(e){ res(); } }); },
};
let S = null;            // app state
const IMG = {};          // uploaded image cache: id -> dataURL
let saveTimer = null;
function save(){ if(Cloud.on){ Cloud.schedule(); return; } clearTimeout(saveTimer); saveTimer = setTimeout(() => Store.set('kv', 'state', JSON.parse(JSON.stringify(S))), 250); }
function putImg(dataUrl){ const id = uid('img'); IMG[id] = dataUrl; Store.set('img', id, dataUrl); if(Cloud.on) Cloud.upImg(id, dataUrl); return id; }
function dropImg(id){ if(!id || id.startsWith('gen:')) return; delete IMG[id]; Store.del('img', id); if(Cloud.on) Cloud.delImg(id); }
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function imgData(id){ if(!id) return ''; if(IMG[id]) return IMG[id]; if(Cloud.on) Cloud.want(id); return ''; }

async function sha(s){ try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tm::'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); } catch(e){ return 'plain::'+s; } }

/* ---- generated imagery (seed photos, placeholder emblem) ---- */
const SCENE_CACHE = {};
function sceneSVG(seed, kind){
  const r = rng(hashStr(seed));
  const skies = [['#BFE0F2','#EEF7FC'],['#CDEBDA','#F1F9F4'],['#A9D3EC','#E6F3FA'],['#D6E9F4','#F5FAFD'],['#B7E3C9','#EAF7EF'],['#C3DDEE','#F2F8FC']];
  const [s1, s2] = skies[Math.floor(r()*skies.length)];
  const greens = ['#0E6F3A','#128944','#4FAE76','#0A5C8F','#7FC6A0'];
  const k = kind || ['camp','hike','fire','lake','troop','forest'][Math.floor(r()*6)];
  const W = 800, H = 560;
  let g = `<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#s)"/>`;
  const sunX = 120 + r()*560, sunY = 90 + r()*90;
  g += `<circle cx="${sunX}" cy="${sunY}" r="${36+r()*24}" fill="#F3E2B5" opacity=".9"/>`;
  for(let l=0;l<3;l++){ let d = `M0 ${H}`; let y = 250 + l*70 + r()*30; for(let x=0;x<=W;x+=80){ y += (r()-.5)*90; y = Math.max(160+l*60, Math.min(440, y)); d += ` L${x} ${y}`; } d += ` L${W} ${H}Z`; g += `<path d="${d}" fill="${greens[(l+Math.floor(r()*2))%greens.length]}" opacity="${.45+l*.2}"/>`; }
  const tree = (x, y, h, c) => `<path d="M${x} ${y-h} L${x-h*.32} ${y} L${x+h*.32} ${y}Z" fill="${c}"/><rect x="${x-3}" y="${y}" width="6" height="${h*.12}" fill="#3a2f22"/>`;
  for(let i=0;i<9;i++) g += tree(r()*W, 470+r()*60, 50+r()*80, r()>.5?'#0A5C30':'#128944');
  g += `<rect y="${H-50}" width="${W}" height="50" fill="#0A5C8F"/>`;
  if(k==='camp'||k==='troop'){ const tx = 200 + r()*300; g += `<path d="M${tx} 380 L${tx-90} 515 L${tx+90} 515Z" fill="#0977B6"/><path d="M${tx} 380 L${tx-20} 515 L${tx+20} 515Z" fill="#0A4F7A"/>`; if(k==='troop') g += `<path d="M${tx+170} 410 L${tx+110} 515 L${tx+230} 515Z" fill="#8CC4E6"/>`; }
  if(k==='fire'){ const fx = 300 + r()*200; g += `<path d="M${fx} 430 C${fx-30} 470 ${fx-25} 505 ${fx} 512 C${fx+25} 505 ${fx+30} 470 ${fx} 430Z" fill="#E09B3D"/><path d="M${fx} 460 C${fx-12} 480 ${fx-10} 505 ${fx} 508 C${fx+10} 505 ${fx+12} 480 ${fx} 460Z" fill="#F3E2B5"/><path d="M${fx-45} 518 L${fx+45} 500 M${fx-45} 500 L${fx+45} 518" stroke="#5a3d22" stroke-width="9" stroke-linecap="round"/>`; }
  if(k==='lake'){ g += `<ellipse cx="${W/2}" cy="${H-40}" rx="${W*.55}" ry="60" fill="#0977B6" opacity=".7"/><ellipse cx="${W/2}" cy="${H-40}" rx="${W*.3}" ry="16" fill="#BFE0F2" opacity=".6"/>`; }
  const ppl = k==='hike'||k==='troop' ? 4+Math.floor(r()*4) : 2+Math.floor(r()*3);
  for(let i=0;i<ppl;i++){ const px = 80 + r()*640, py = 500 + r()*20, c = ['#0977B6','#128944','#0A5C8F','#5E9FC8'][i%4]; g += `<circle cx="${px}" cy="${py-46}" r="9" fill="#2a2a24"/><path d="M${px-11} ${py} L${px-9} ${py-34} Q${px} ${py-40} ${px+9} ${py-34} L${px+11} ${py}Z" fill="${c}"/><path d="M${px-6} ${py-34} L${px} ${py-24} L${px+6} ${py-34}" fill="#FFFFFF"/>`; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function genSrc(ref){ if(!SCENE_CACHE[ref]){ const [,seed,kind] = ref.split(':'); SCENE_CACHE[ref] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sceneSVG(seed, kind)); } return SCENE_CACHE[ref]; }
function src(ref){ if(!ref) return ''; if(ref.startsWith('gen:')) return genSrc(ref); return imgData(ref) || BLANK; }

function expandEvents(from, to){

    const len = e.endDate ? Math.round((pd(e.endDate) - pd(e.date))/86400000) : 0;
    if(e.recur==='none' || !e.recur){ const end = e.endDate || e.date; if(end >= from && e.date <= to) out.push({ ...e, occ:e.date, occEnd:iso(addDays(pd(e.date), len)) }); return; }
    let d = pd(e.date); const until = e.until || to; let guard = 0;
    while(iso(d) <= to && iso(d) <= until && guard++ < 800){ const ds = iso(d);
      if(ds >= from && !(e.skip||[]).includes(ds)){ const hol = S.events.find(h => h.type==='holiday' && ds >= h.date && ds <= (h.endDate||h.date)); if(!hol || e.type==='holiday') out.push({ ...e, occ:ds, occEnd:iso(addDays(d, len)) }); }
      d = e.recur==='weekly' ? addDays(d, 7) : e.recur==='fortnightly' ? addDays(d, 14) : new Date(d.getFullYear(), d.getMonth()+1, d.getDate()); }

  const W = 640, H = h, L = 40, Rr = 14, T = 28, B = 28, iw = W-L-Rr, ih = H-T-B; const n = pts.length; if(!n) return empty('clipboard','No sessions yet');

function donut(segs, label){
  const tot = segs.reduce((a,s)=>a+s.v,0) || 1; let a0 = -Math.PI/2; const R0 = 62, r0 = 42, cx = 80, cy = 80;
  const arcs = segs.filter(s=>s.v).map(s => { const a1 = a0 + s.v/tot*Math.PI*2; const big = a1-a0 > Math.PI ? 1 : 0;

  return `<div class="row nw" style="gap:18px"><svg class="chart" viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="${label}">${arcs}<text x="80" y="78" text-anchor="middle" style="font-family:var(--f-head);font-size:26px;font-weight:600;fill:var(--ink)">${tot}</text><text x="80" y="96" text-anchor="middle">scouts</text></svg>

function dataUrlToBlob(u){ const [h, d] = u.split(','); const mime = (h.match(/data:([^;,]+)/)||[])[1] || 'application/octet-stream'; if(/;base64/.test(h)){ const b = atob(d); const a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return new Blob([a], { type:mime }); } return new Blob([decodeURIComponent(d)], { type:mime }); }

function loadImg(srcUrl){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = srcUrl; }); }
async function compress(file, max=1400, q=.78){ const url = await readFile(file); const im = await loadImg(url); const k = Math.min(1, max/Math.max(im.width, im.height));
  const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return { full:c.toDataURL('image/jpeg', q), w:c.width, h:c.height, origKB:Math.round(file.size/1024) }; }

  const bdg = (S.badges||[]).filter(x => /tenderfoot/i.test(x.name||'')).slice(0,1).map(x => x.id);

let CROP = null;
A.photoScout = el => photoModal('scout', el.dataset.id);
A.photoLeader = el => photoModal('user', el.dataset.id);
function photoModal(kind, id){ const o = kind==='scout' ? scout(id) : user(id);
  modal({ title:'Profile photo', body:`<div class="stack"><label class="drop" for="ph-file" style="cursor:pointer" id="ph-drop">${ic('camera','lg')}<div style="font-weight:600;margin-top:6px">Take or choose a photo</div><div class="small">JPG or PNG. You can crop it next.</div><input id="ph-file" type="file" accept="image/*" class="sr" data-c="cropFile"></label>
    <div id="crop-area" class="hide"><div class="crop-box" id="crop-box"><canvas id="crop-cv" width="640" height="640"></canvas><div class="crop-ring"></div></div><div class="field" style="margin-top:12px"><label for="crop-z">Zoom</label><input id="crop-z" type="range" min="1" max="4" step="0.01" value="1" data-i="cropZoom"></div><p class="small muted" style="text-align:center">Drag the photo to position the face inside the circle.</p></div></div>`,
    foot:`${o.photo?`<button class="btn danger" data-a="photoRemove" data-k="${kind}" data-id="${id}">Remove photo</button><span class="spacer"></span>`:''}<button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="cropSave" data-k="${kind}" data-id="${id}" disabled id="crop-save">Save photo</button>` }); }
C.cropFile = async el => { const f = el.files[0]; if(!f) return; const url = await readFile(f); const im = await loadImg(url);
  CROP = { im, z:1, x:0, y:0 }; $('#crop-area').classList.remove('hide'); $('#ph-drop').classList.add('hide'); $('#crop-save').disabled = false; drawCrop();
  const box = $('#crop-box'); let drag = null;
  box.onpointerdown = e => { drag = { x:e.clientX, y:e.clientY, ox:CROP.x, oy:CROP.y }; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { if(!drag) return; const k = 640 / box.clientWidth; CROP.x = drag.ox + (e.clientX-drag.x)*k; CROP.y = drag.oy + (e.clientY-drag.y)*k; drawCrop(); };
  box.onpointerup = () => drag = null; };
I.cropZoom = el => { CROP.z = +el.value; drawCrop(); };
function drawCrop(cv = $('#crop-cv'), size = 640){ const { im, z, x, y } = CROP; const ctx = cv.getContext('2d'); const base = Math.max(size/im.width, size/im.height) * z; const w = im.width*base, h = im.height*base; const k = size/640;
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,size,size); ctx.drawImage(im, (size-w)/2 + x*k, (size-h)/2 + y*k, w, h); }
A.cropSave = el => { const out = document.createElement('canvas'); out.width = out.height = 400; drawCrop(out, 400); const url = out.toDataURL('image/jpeg', .85);
  const o = el.dataset.k==='scout' ? scout(el.dataset.id) : user(el.dataset.id); dropImg(o.photo); o.photo = putImg(url); audit(`Updated photo for ${o.name || sname(o)}`); closeModal(); CROP = null; renderApp(); toast('Photo saved'); };
/* ---- bulk profile photos: pick many images, match each to a scout by file name, save all at once ---- */
let BULK = [];
const normName = t => String(t||'').toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]+/g,' ').trim();
function guessScout(file, taken){ const n = normName(file); if(!n) return '';
  const free = S.scouts.filter(s => !taken.has(s.id));
  const hit = free.find(s => normName(s.sid)===n) || free.find(s => normName(sname(s))===n) || free.find(s => normName(s.last+' '+s.first)===n)
    || free.find(s => n.includes(normName(sname(s)))) || free.find(s => normName(sname(s)).startsWith(n) && n.length > 3);
  return hit ? hit.id : ''; }
async function squarePhoto(file){ const im = await loadImg(await readFile(file)); const side = Math.min(im.width, im.height);
  const sx = (im.width-side)/2, sy = im.height > im.width ? (im.height-side)*.2 : 0;   // portraits: keep the top, where the face usually is
  const c = document.createElement('canvas'); c.width = c.height = 400; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,400,400); x.drawImage(im, sx, sy, side, side, 0, 0, 400, 400); return c.toDataURL('image/jpeg', .85); }
A.bulkPhotos = () => { BULK = []; modal({ title:'Bulk scout photos', wide:true, body:`<div class="stack"><p class="muted">Choose several photos at once. Name each file after the scout (for example <b>Aishath Hanaan.jpg</b> or their scout ID) and it is matched automatically; otherwise pick the scout from the list. Photos are cropped to a square from the centre, and you can recrop any of them later from the scout's profile.</p>
  <label class="drop" for="bulk-file" style="cursor:pointer">${ic('camera','lg')}<div style="font-weight:600;margin-top:6px">Choose photos</div><div class="small">JPG or PNG, as many as you like</div><input id="bulk-file" type="file" accept="image/*" multiple class="sr" data-c="bulkFiles"></label><div id="bulk-list"></div></div>`,
  foot:`<button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="bulkSave" id="bulk-save" disabled>Save photos</button>` }); };
C.bulkFiles = async el => { const files = [...el.files]; if(!files.length) return; $('#bulk-list').innerHTML = `<p class="small muted">Preparing ${files.length} photos…</p>`;
  const taken = new Set(BULK.map(b => b.sid).filter(Boolean));
  for(const f of files){ try { const url = await squarePhoto(f); const sid = guessScout(f.name, taken); if(sid) taken.add(sid); BULK.push({ name:f.name, url, sid }); } catch(e){ BULK.push({ name:f.name, bad:true }); } }
  el.value = ''; bulkRender(); };
function bulkRender(){ const list = [...S.scouts].sort((a,b) => sname(a).localeCompare(sname(b))); const n = BULK.filter(b => b.sid && !b.bad).length;
  const dup = new Set(BULK.map(b => b.sid).filter((v,i,a) => v && a.indexOf(v)!==i));
  $('#bulk-list').innerHTML = `<div class="small muted" style="margin:4px 0 8px">${n} of ${BULK.length} photos matched to a scout${dup.size?` · <span style="color:var(--bad)">the same scout is picked more than once</span>`:''}</div>
  <div class="stack" style="gap:8px">${BULK.map((b,i) => `<div class="row nw" style="gap:12px;align-items:center">${b.bad ? `<span class="av" style="width:52px;height:52px">!</span>` : `<img src="${b.url}" alt="" style="width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none">`}
    <div style="flex:1;min-width:0"><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</div>${b.bad ? `<div class="small" style="color:var(--bad)">This file could not be read</div>` :
    `<select class="inp" data-c="bulkPick" data-n="${i}" style="${dup.has(b.sid)?'border-color:var(--bad)':''}">${opts([['','— Skip this photo —'], ...list.map(s => [s.id, sname(s) + (s.photo?' (replaces photo)':'')])], b.sid)}</select>`}</div></div>`).join('')}</div>`;
  $('#bulk-save').disabled = !n || dup.size > 0; $('#bulk-save').textContent = n ? `Save ${n} photo${n>1?'s':''}` : 'Save photos'; }
C.bulkPick = el => { BULK[+el.dataset.n].sid = el.value; bulkRender(); };
A.bulkSave = () => { let n = 0; BULK.forEach(b => { const s = !b.bad && b.sid && scout(b.sid); if(!s) return; dropImg(s.photo); s.photo = putImg(b.url); n++; });
  audit(`Uploaded ${n} scout photos in bulk`); BULK = []; closeModal(); save(); renderApp(); toast(`Saved ${n} photo${n>1?'s':''}`); };
A.photoRemove = el => { const o = el.dataset.k==='scout' ? scout(el.dataset.id) : user(el.dataset.id); dropImg(o.photo); o.photo = null; save(); closeModal(); renderApp(); toast('Photo removed'); };

  const ctx = await pdfDoc(sname(s), `${s.sid}  ·  ${p?.name||''} patrol  ·  ${s.rank}  ·  ${s.status}`);
  if(s.photo && IMG[s.photo]){ try { ctx.doc.addImage(IMG[s.photo], 'JPEG', ctx.W-112, 88, 80, 80); } catch(e){} }
  pdfH(ctx, 'Details'); pdfTable(ctx, ['Field','Value'], [['Date of birth', `${fmtD(s.dob)} (age ${age(s.dob)})`],['Class / grade', s.grade],['Patrol', p?.name||'—'],['Rank / level', s.rank],['Joined', fmtD(s.joined)],['Membership', s.status],['Assigned leaders', (p?.leaders||[]).map(id=>user(id)?.name).join(', ')]], [160, 371]);
  pdfH(ctx, 'Attendance'); pdfTable(ctx, ['Present','Late','Absent','Excused','Sessions','Rate'], [[a.P,a.L,a.A,a.E,a.total,a.pct+'%']], [88,88,88,88,88,91]);
  pdfH(ctx, 'Badges'); pdfTable(ctx, ['Badge','Category','Date awarded','Awarded by'], s.badges.map(a => [badge(a.badgeId)?.name, catLabel(badge(a.badgeId)?.category), fmtD(a.date), user(a.by)?.name||'']), [170,130,100,131]);
  pdfH(ctx, `Syllabus: ${s.rank} (${sy.done}/${sy.total}, ${sy.behind} behind)`); pdfTable(ctx, ['Item','Signed off','By','Note'], sy.items.map(i => { const d = s.syllabus[i.id]; return [i.topic, d?fmtD(d.date):'—', d?user(d.by)?.name:'', d?.note||'']; }), [170,90,110,161]);
  pdfH(ctx, 'Activities'); pdfTable(ctx, ['Activity','Type','Date','Role','Cert.'], (s.activities||[]).map(x => [x.title, ACT_TYPES[x.type]||x.type, fmtD(x.date), x.role, x.cert?'Yes':'']), [180,90,90,121,50]);
  if(can('contacts.view') || can('medical.view')){ pdfH(ctx, 'Restricted: contacts & medical'); const rows = []; if(can('contacts.view')) rows.push(['Guardian', `${s.guardian?.name||''} (${s.guardian?.relation||''}) ${s.guardian?.phone||''}`],['Emergency', `${s.emergency?.name||''} ${s.emergency?.phone||''}`]); if(can('medical.view')) rows.push(['Medical', s.medical||'None recorded']); pdfTable(ctx, ['Field','Value'], rows, [120,411]); }
  await pdfSave(ctx, `${s.sid}-${s.first}-${s.last}.pdf`.replace(/\s+/g,'-')); });

    lowAttendance().forEach(({ s, a }) => { if(!S.notifications.some(n => n.type==='attendance' && n.link?.id===s.id && Date.now()-n.ts < 14*86400000)) notify('attendance', `Low attendance: ${sname(s)}`, `Attendance is ${a.pct}%, below the ${S.settings.lowAttendance}% threshold.`, { route:'scout', id:s.id }); });
    S.patrols.forEach(p => { const ids = regScouts(r).filter(s=>s.patrol===p.id); const pres = ids.filter(s => ['P','L'].includes(r.entries[s.id]?.s)).length; if(ids.length && pres===ids.length) { p.points += 10; } });

  if(c.U) confirmBox(`${c.U} scout${c.U>1?'s are':' is'} still unmarked. Finalize anyway? Unmarked scouts are left out of attendance figures.`, go2, 'Finalize'); else confirmBox('Finalize and lock this register? Only the Group Scout Leader can edit it afterwards. Patrols with full attendance earn 10 points.', go2, 'Finalize'); };

/* ---- reports ---- */
function reportRegs(){ const f = R.q.rp || 'all'; const terms = S.settings.terms; return S.registers.filter(r => f==='all' || (t => r.date >= t.start && r.date <= t.end)(terms[+f])); }
function attReports(){
  const regs = reportRegs(); const f = R.q.rp || 'all';
  const ind = activeScouts().map(s => ({ s, a:attOf(s.id, regs) })).filter(x => x.a.total).sort((a,b) => a.a.pct - b.a.pct);
  const low = ind.filter(x => x.a.pct < S.settings.lowAttendance && x.a.total >= 3);
  const months = {}; regs.forEach(r => { const m = r.date.slice(0,7); const c = regCounts(r); months[m] = months[m] || { n:0, sum:0, P:0, L:0, A:0, E:0 }; months[m].n++; months[m].sum += c.pct; ['P','L','A','E'].forEach(k => months[m][k] += c[k]); });
  const mrows = Object.entries(months).sort((a,b) => a[0] < b[0] ? 1 : -1);
  const prow = S.patrols.map(p => { const ids = S.scouts.filter(s=>s.patrol===p.id); const c = {P:0,L:0,A:0,E:0}; regs.forEach(r => ids.forEach(s => { const e = r.entries[s.id]; if(e?.s) c[e.s]++; })); const t = c.P+c.L+c.A+c.E; return { p, c, pct:pct(c.P+c.L, t) }; });
  return `<div class="row" style="margin-bottom:14px"><div class="field" style="min-width:200px"><label for="rp">Period</label><select class="inp" id="rp" data-c="rpFilter">${opts([['all','Whole year'], ...S.settings.terms.map((t,i)=>[i, t.name])], f)}</select></div><span class="spacer"></span>
    ${can('export')||ME.role==='assistant' ? `<button class="btn" data-a="repXLSX">${ic('download','sm')} Excel</button><button class="btn" data-a="repPDF">${ic('file','sm')} PDF report</button>` : ''}</div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h2>Patrol attendance</h2><span class="small muted">${regs.length} registers</span></div>${prow.map(x => `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:5px"><span class="row" style="gap:7px;font-weight:600">${pDot(x.p)}${esc(x.p.name)}</span><b class="num">${x.pct}%</b></div>${bar(x.pct)}<div class="small muted num" style="margin-top:4px">P ${x.c.P} · L ${x.c.L} · A ${x.c.A} · E ${x.c.E}</div></div>`).join('')}</div>
    <div class="card"><div class="card-h"><h2>Low-attendance alerts</h2>${chip(`Below ${S.settings.lowAttendance}%`,'bad')}</div><div class="list">${low.map(({s,a}) => `<button class="li" style="border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left;cursor:pointer" data-a="go" data-r="scout" data-id="${s.id}" data-tab="attendance">${av(s,36)}<span class="grow"><b class="ttl" style="display:block">${esc(sname(s))}</b><span class="small muted">${pName(s.patrol)} · ${a.A} absences, ${a.E} excused</span></span><b class="num" style="color:var(--bad)">${a.pct}%</b></button>`).join('') || empty('check','No scouts below the threshold')}</div>
    ${low.length && !isScout() ? `<button class="btn sm" style="margin-top:8px" data-a="lowNotify">${ic('bell','sm')} Send alert to leaders</button>` : ''}</div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Monthly summary</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Sessions</th><th>Present</th><th>Late</th><th>Absent</th><th>Excused</th><th>Average</th></tr></thead><tbody>${mrows.map(([m,v]) => `<tr><td>${MONL[+m.slice(5)-1]} ${m.slice(0,4)}</td><td class="num">${v.n}</td><td class="num">${v.P}</td><td class="num">${v.L}</td><td class="num">${v.A}</td><td class="num">${v.E}</td><td><span class="row nw"><span style="width:90px">${bar(Math.round(v.sum/v.n))}</span><b class="num">${Math.round(v.sum/v.n)}%</b></span></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h2>Individual attendance</h2><span class="small muted">Lowest first</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Scout</th><th>Patrol</th><th>P</th><th>L</th><th>A</th><th>E</th><th style="min-width:150px">Rate</th></tr></thead><tbody>${ind.map(({s,a}) => `<tr class="click" data-a="go" data-r="scout" data-id="${s.id}" data-tab="attendance"><td><span class="row nw">${av(s,28)}${esc(sname(s))}</span></td><td>${esc(pName(s.patrol))}</td><td class="num">${a.P}</td><td class="num">${a.L}</td><td class="num">${a.A}</td><td class="num">${a.E}</td><td><span class="row nw"><span style="width:90px">${bar(a.pct)}</span><b class="num" style="color:${a.pct<S.settings.lowAttendance?'var(--bad)':'inherit'}">${a.pct}%</b></span></td></tr>`).join('')}</tbody></table></div></div>`;
}

A.lowNotify = () => { const low = lowAttendance(); notify('attendance', `${low.length} scouts below ${S.settings.lowAttendance}% attendance`, low.map(x => `${sname(x.s)} (${x.a.pct}%)`).join(', '), { route:'attendance', tab:'reports' }); refresh(); toast('Alert sent to all leaders'); };
function repData(){ const regs = reportRegs(); const ind = activeScouts().map(s => ({ s, a:attOf(s.id, regs) })).filter(x => x.a.total).sort((a,b) => sname(a.s).localeCompare(sname(b.s)));
  return { regs, rows: ind.map(({s,a}) => [sname(s), s.sid, pName(s.patrol), a.P, a.L, a.A, a.E, a.total, a.pct+'%']),
    prow: S.patrols.map(p => { const ids = S.scouts.filter(s=>s.patrol===p.id); let c = {P:0,L:0,A:0,E:0}; regs.forEach(r => ids.forEach(s => { const e = r.entries[s.id]; if(e?.s) c[e.s]++; })); const t = c.P+c.L+c.A+c.E; return [p.name, c.P, c.L, c.A, c.E, pct(c.P+c.L,t)+'%']; }),
    log: regs.sort(by('date')).map(r => { const c = regCounts(r); return [r.date, r.type, pName(r.patrol), c.P, c.L, c.A, c.E, c.pct+'%', r.status]; }) }; }
A.repXLSX = () => { const d = repData(); const per = R.q.rp && R.q.rp!=='all' ? S.settings.terms[+R.q.rp].name : 'Year';
  exportXLSX(`attendance-report-${per.replace(/\s/g,'')}-${TODAY()}.xlsx`, [['Individuals', [['Scout','ID','Patrol','Present','Late','Absent','Excused','Sessions','Rate'], ...d.rows]], ['Patrols', [['Patrol','Present','Late','Absent','Excused','Rate'], ...d.prow]], ['Registers', [['Date','Type','Who','Present','Late','Absent','Excused','Rate','Status'], ...d.log]]]); };
A.repPDF = () => withPDF(async () => { const d = repData(); const per = R.q.rp && R.q.rp!=='all' ? S.settings.terms[+R.q.rp].name : 'Whole year ' + S.settings.year;
  const ctx = await pdfDoc('Attendance report', `${per}  ·  ${d.regs.length} registers`);
  pdfH(ctx, 'By patrol'); pdfTable(ctx, ['Patrol','Present','Late','Absent','Excused','Rate'], d.prow, [131,80,80,80,80,80]);
  pdfH(ctx, 'By scout'); pdfTable(ctx, ['Scout','ID','Patrol','P','L','A','E','Total','Rate'], d.rows, [125,90,62,38,38,38,38,46,56]);
  await pdfSave(ctx, `attendance-report-${TODAY()}.pdf`); });

  <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Points leaderboard</h2><span class="small muted">Full-attendance registers add 10 points; badge awards add 5</span></div>
    <div class="stack" style="gap:12px">${ranked.map((p,i) => `<div class="row nw" style="gap:12px"><span class="lb-rank ${i===0?'r1':''}">${i+1}</span><span class="emblem" style="background:${p.color};width:34px;height:34px;border-radius:9px">${ic(p.icon,'sm')}</span><b style="width:80px">${esc(p.name)}</b><div style="flex:1;height:14px;background:var(--line-2);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${p.points*100/maxP}%;background:${i===0?'var(--gold)':p.color};border-radius:99px"></i></div><b class="num" style="width:44px;text-align:right">${p.points}</b>
    ${ed ? `<button class="btn sm" data-a="points" data-id="${p.id}" aria-label="Adjust points for ${esc(p.name)}">±</button>` : ''}</div>`).join('')}</div></div>
  ${ed ? `<p class="small muted" style="margin-bottom:10px">${ic('grip','sm')} Drag scouts between patrols, or use the move menu on touch screens.</p>` : ''}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">${S.patrols.map(p => { const ms = S.scouts.filter(s => s.patrol===p.id).sort((a,b) => (a.id===p.pl?-2:a.id===p.apl?-1:0) - (b.id===p.pl?-2:b.id===p.apl?-1:0) || sname(a).localeCompare(sname(b)));
    const badgesN = ms.reduce((a,s)=>a+s.badges.length,0);
    return `<div class="card patrol-col" style="--pc:${p.color}"><div class="row nw" style="gap:12px;margin-bottom:10px"><span class="emblem" style="background:${p.color}">${ic(p.icon,'lg')}</span><div style="flex:1;min-width:0"><h2>${esc(p.name)}</h2><div class="small muted" style="font-style:italic">“${esc(p.motto)}”</div></div>${ed?`<button class="icon-btn" data-a="patrolForm" data-id="${p.id}" aria-label="Edit patrol">${ic('edit')}</button>`:''}</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center">${[[ms.length,'Scouts'],[patrolAtt(p.id)+'%','Attendance'],[badgesN,'Badges']].map(([v,l]) => `<div style="background:var(--surface-2);border-radius:10px;padding:8px 4px"><b class="num" style="font-family:var(--f-head);font-size:1.15rem;display:block">${v}</b><span class="small muted">${l}</span></div>`).join('')}</div>
    <div class="small muted" style="margin-bottom:8px">Leaders: ${p.leaders.map(id => esc(user(id)?.name)).join(', ') || '—'}</div>
    <div class="dz" data-dz="${p.id}">${ms.map(s => `<div class="drag" ${ed?'draggable="true"':''} data-drag="${s.id}">${ed?`<span class="muted" aria-hidden="true">${ic('grip','sm')}</span>`:''}${av(s,30)}<button style="flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:0" data-a="go" data-r="scout" data-id="${s.id}"><b style="display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sname(s))}</b><span class="small muted">${s.id===p.pl?'Patrol Leader':s.id===p.apl?'Assistant PL':esc(s.rank)}</span></button>
      ${ed?`<select class="inp touch-move" style="width:auto;height:32px;font-size:.78rem;padding:0 6px" data-c="moveScout" data-sid="${s.id}" aria-label="Move ${esc(s.first)} to patrol">${opts(S.patrols.map(x=>[x.id, x.id===p.id?'Move…':x.name]), p.id)}</select>`:''}</div>`).join('')}</div></div>`; }).join('')}</div>`;
};
AFTER.patrols = () => { if(!can('patrol.edit')) return; let dragId = null;
  $$('[data-drag]').forEach(el => { el.addEventListener('dragstart', e => { dragId = el.dataset.drag; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(x){} }); el.addEventListener('dragend', () => el.classList.remove('dragging')); });
  $$('[data-dz]').forEach(z => { z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); }); z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); if(dragId) moveScout(dragId, z.dataset.dz); }); }); };
function moveScout(sid, pid){ const s = scout(sid); if(!s || s.patrol===pid) return; const old = patrol(s.patrol);
  if(old){ if(old.pl===sid) old.pl = null; if(old.apl===sid) old.apl = null; } s.patrol = pid; audit(`Moved ${sname(s)} from ${old?.name} to ${patrol(pid).name}`); refresh(); toast(`${s.first} moved to ${patrol(pid).name}`); }
C.colorCustom = el => $$('input[name=color]').forEach(r => r.checked = false);
C.moveScout = el => moveScout(el.dataset.sid, el.value);
A.points = el => { const p = patrol(el.dataset.id); modal({ title:`Adjust points: ${esc(p.name)}`, form:'points', body:`<input type="hidden" name="id" value="${p.id}"><div class="form-grid">${field('Points (use minus to deduct)', inp('n','5','type="number" step="1" required'))}${field('Reason', inp('why','Uniform inspection'))}</div>`, foot:`<button type="button" class="btn" data-a="closeModal">Cancel</button><button class="btn primary">Apply</button>` }); };
F.points = d => { const p = patrol(d.id); const n = parseInt(d.n,10)||0; p.points = Math.max(0, p.points + n); audit(`${n>=0?'Added':'Deducted'} ${Math.abs(n)} points ${n>=0?'to':'from'} ${p.name}: ${d.why}`); closeModal(); refresh(); toast(`${p.name}: ${n>=0?'+':''}${n} points`); };

    <div class="field full"><label>Emblem / flag</label><div class="row">${PATROL_ICONS.map(i => `<label style="cursor:pointer"><input type="radio" name="icon" value="${i}" ${p.icon===i?'checked':''} class="sr"><span class="icon-pick">${ic(i)}</span></label>`).join('')}</div></div>
    ${p.id ? `${field('Patrol Leader', sel('pl', [['','—'], ...ms.map(s=>[s.id, sname(s)])], p.pl))}${field('Assistant Patrol Leader', sel('apl', [['','—'], ...ms.map(s=>[s.id, sname(s)])], p.apl))}` : ''}
    <div class="field full"><label>Leaders responsible</label><div class="row">${leaderUsers().map(u => `<label class="check"><input type="checkbox" name="leaders" value="${u.id}" ${p.leaders.includes(u.id)?'checked':''}> ${esc(u.name)}</label>`).join('')}</div></div></div>`,

F.patrol = d => { if(!d.name?.trim()) return; let p = d.id && patrol(d.id); const isNew = !p; if(isNew){ p = { id:uid('p'), points:0, pl:null, apl:null }; S.patrols.push(p); }
  const custom = d.color || d.colorCustom;

  if(!isNew){ p.pl = d.pl||null; p.apl = d.apl && d.apl!==d.pl ? d.apl : null; }

/* Full syllabus text from the PDF (blocks), or the plain requirement list for custom badges. */
function sylHTML(b){ if(b.nosyl) return `<div class="syl"><div class="note">No syllabus has been published for this badge yet.</div></div>`;

/* PDF in the same sash design */
const BIMG = {};
async function badgeImgData(b){ if(!b?.img) return null; if(b.img.startsWith('data:')) return b.img; if(BIMG[b.img] !== undefined) return BIMG[b.img];
  try { const r = await fetch(b.img); const bl = await r.blob(); BIMG[b.img] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(bl); }); } catch(e){ BIMG[b.img] = null; } return BIMG[b.img]; }

A.badgePDF = () => withPDF(async () => { const list = sashScouts(), bs = S.badges.slice().sort((a,b) => a.name.localeCompare(b.name)), sc = activeScouts();

  const groups = [['Girl','Girls',[194,65,122]],['Boy','Boys',[13,120,182]],['','No gender set',[107,124,138]]].map(([k,l,c]) => [l, c, list.filter(s => genderOf(s.gender)===k)]).filter(x => x[2].length);
  const BS = 22, nameW = 150, cntW = 60, sashW = w - nameW - cntW - 24, per = Math.max(1, Math.floor((sashW - 12) / (BS + 4)));
  for(const [l, c, ss] of groups){ need(60); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...c); doc.text(`${l.toUpperCase()}  (${ss.length})`, x0, ctx.y + 4); ctx.y += 12;
    for(const s of ss){ const got = bs.filter(b => hasBadge(s,b.id)); const lines = Math.max(1, Math.ceil(got.length / per)); const rh = Math.max(44, 16 + lines*(BS+4)); need(rh + 6);
      const y = ctx.y; doc.setDrawColor(213,227,237); doc.setFillColor(255,255,255); doc.roundedRect(x0, y, w, rh, 8, 8, 'FD'); doc.setFillColor(...c); doc.rect(x0, y+1, 4, rh-2, 'F');
      doc.setTextColor(19,40,58); doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text(doc.splitTextToSize(sname(s), nameW-14).slice(0,2), x0+12, y+18);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(78,101,119); doc.text(pName(s.patrol), x0+12, y+rh-10);

function icsText(){ const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; const dt = (d, t) => d.replace(/-/g,'') + (t ? 'T'+t.replace(':','')+'00' : '');

    if(e.remind) lines.push('BEGIN:VALARM','TRIGGER:-P2D','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM'); lines.push('END:VEVENT'); });
  lines.push('END:VCALENDAR'); return lines.join('\r\n'); }
